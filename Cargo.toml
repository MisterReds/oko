[package]
name = "oko"
version = "0.1.0"
edition = "2021"
description = "ОКО — минималистичная альтернатива Veyon: мониторинг ученических ПК"
license = "MIT"

[[bin]]
name = "oko-agent"
path = "src/bin/agent.rs"

[[bin]]
name = "oko-master"
path = "src/bin/master.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ab_glyph = "0.2"
tokio-tungstenite = "0.24"
x11rb = "0.13"

[profile.release]
opt-level = 2
codegen-units = 16
