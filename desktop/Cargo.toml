[package]
name = "oko-desktop"
version = "0.4.2"
edition = "2021"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
anyhow = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 8
strip = true
