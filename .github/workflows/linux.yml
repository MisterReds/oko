name: Linux CI and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    name: Build and test Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Rust 1.91.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target

      - name: Install native build and smoke-test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev squashfs-tools fonts-dejavu-core \
            xvfb xauth libgl1-mesa-dri
          mkdir -p .cache

      - name: Prepare build-time font
        run: bash scripts/bootstrap-fonts.sh

      - name: Diagnose basic Linux build compatibility
        run: bash scripts/doctor.sh

      - name: Test installer, updates, rollback and uninstall
        run: python3 tests/installer-lifecycle.py

      - name: Test core and protocol
        run: cargo test --release --locked

      - name: Compile agent and master
        run: cargo build --release --locked

      - name: Compile native desktop UI
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml

      - name: Test honest student connection and capture status
        run: python3 tests/agent-health.py

      - name: Test teacher/student role isolation
        run: node tests/role-auth.mjs

      - name: Security regression - WSS student endpoint cannot access teacher API
        run: python3 tests/tls-surface.py

      - name: Integration test encrypted WSS, certificate pinning and reconnection
        run: python3 tests/tls-reconnect.py

      - name: Integration test X11 keyboard/pointer lock and fail-safe
        run: python3 tests/lock-x11.py

      - name: Smoke-test both native windows under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tests/smoke-gui.py

      - name: Full GUI test of encrypted classroom pairing
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tests/gui-tls.py

      - name: Download AppImage packaging tool
        run: |
          curl -fL --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o .cache/appimagetool-x86_64.AppImage
          chmod +x .cache/appimagetool-x86_64.AppImage

      - name: Produce AppImage, DEB and portable archives
        run: python3 scripts/package-linux.py

      - name: Verify source tarball is independently buildable
        run: python3 tests/source-package.py

      - name: Test packaged AppImages with real TLS/WSS classroom GUI
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OKO_TEST_APPIMAGE: '1'
        run: xvfb-run -a python3 tests/gui-tls.py

      - name: Verify checksums and packages
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' ../Cargo.toml | head -1)"
          test -n "$VERSION"
          unzip -t "OkoNative-${VERSION}-FULL.zip" | tail -1
          "./OkoTeacher-${VERSION}-x86_64.AppImage" --appimage-extract-and-run --help
          "./OkoStudent-${VERSION}-x86_64.AppImage" --appimage-extract-and-run --help

      - name: Publish workflow artifacts for testing
        uses: actions/upload-artifact@v4
        with:
          name: oko-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/README-START.txt
          if-no-files-found: error
          retention-days: 30

  distro-compat:
    name: Check packaged GUI on Ubuntu 24.04 and Fedora 43
    needs: build-linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout integration tests
        uses: actions/checkout@v4

      - name: Download tested release packages
        uses: actions/download-artifact@v4
        with:
          name: oko-linux-x86_64
          path: dist

      - name: Smoke-test Ubuntu 24.04 desktop and WSS
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libxkbcommon-x11-0 libgl1 libx11-6
          chmod +x dist/OkoTeacher-*.AppImage dist/OkoStudent-*.AppImage
          (cd dist && sha256sum -c SHA256SUMS)
          OKO_TEST_APPIMAGE=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a python3 tests/gui-tls.py

      - name: Smoke-test Fedora 43 X11 and WSS
        run: |
          set -euo pipefail
          docker run --rm --network bridge --memory 3g --cpus 2 \
            -v "$PWD:/work:ro" -w /work fedora:43 bash -lc '
              set -e
              dnf -y -q install python3 xorg-x11-server-Xvfb \
                libX11 libxcb libxkbcommon libxkbcommon-x11 \
                mesa-libGL mesa-dri-drivers libXcursor libXrandr libXi libwayland-client
              Xvfb :98 -screen 0 800x600x24 -nolisten tcp >/tmp/oko-xvfb.log 2>&1 &
              sleep 1
              DISPLAY=:98 LIBGL_ALWAYS_SOFTWARE=1 OKO_TEST_APPIMAGE=1 python3 tests/gui-tls.py
            '

  github-release:
    name: Publish GitHub Release after successful CI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-x86_64, distro-compat]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages from validated build
        uses: actions/download-artifact@v4
        with:
          name: oko-linux-x86_64
          path: release

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "ОКО $TAG" --generate-notes
          fi
          gh release upload "$TAG" ./*.AppImage ./*.deb ./*.tar.gz ./*.zip ./SHA256SUMS ./README-START.txt --clobber
